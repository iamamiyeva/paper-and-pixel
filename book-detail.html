<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book-details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>        

    <div class="detail-container">
        <div class="detail-left">
            <img src="pictures/default-cover.jpg" alt="Book cover" id="book-cover">
        </div>
        <div class="detail-right">
            <h1 id="book-title">Book title</h1>
            <h3 class="author" id="book-author">Author name</h3>

            <div class="book-meta">
                <p><b>Category:</b> <span id="book-category">-</span></p>
                <p><b>Point:</b> <span id="book-point">/ 10</span></p>
                <p><b>Book page:</b> <span id="book-page">-</span></p>
                <p><b>Book date</b> <span id="book-date">-</span></p>
            </div>

            <hr>
            <div class="book-summary">
                <h3>Book summary</h3>
                <p id="book-summary">Details loading...</p>
            </div>

            <a href="index.html" class="back-btn">Back to Library</a>

        </div>
    </div>
        

    <script src="detail.js"></script>
</body>
</html>
